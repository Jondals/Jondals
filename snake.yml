name: Generate contribution snake
 
on:
  schedule:
    - cron: "0 0 * * *"   # every day at midnight
  workflow_dispatch:       # lets you run it manually
  push:
    branches: [main, master]
 
permissions:
  contents: write
 
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#bb9af7&color_dots=#24283b,#2e3c64,#3d59a1,#5a7bd6,#7aa2f7
            dist/snake-light.svg?color_snake=#7aa2f7&color_dots=#ebedf0,#c7d2fe,#93a8f4,#5a7bd6,#3d59a1
 
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
